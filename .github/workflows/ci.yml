name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"
      - name: Run engine tests
        run: python -m pytest engine/tests -q
      - name: CLI smoke
        run: |
          neurokiln arena --dataset synthetic --protocol within_subject --folds 2 \
            --pipeline raw_centroid --pipeline var_centroid --no-save --no-cache --json

  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"
      - name: Run engine tests
        shell: bash
        run: python -m pytest engine/tests -q
      - name: CLI smoke
        shell: bash
        run: |
          neurokiln arena --dataset synthetic --protocol within_subject --folds 2 \
            --pipeline raw_centroid --pipeline var_centroid --no-save --no-cache --json

  api:
    name: API functional smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            server/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"
          python -m pip install -r server/requirements.txt
          python -m pip install httpx
      - name: Explanation API tests
        run: python -m pytest server/tests -q
      - name: Bootstrap, login and call protected routes
        env:
          NEUROKILN_DATA_DIR: ${{ runner.temp }}/neurokiln-ci
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("server").resolve()))
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              health = client.get("/api/health")
              assert health.status_code == 200, health.text
              assert health.json()["status"] == "ok"
              assert client.get("/api/cache").status_code == 401

              status = client.get("/api/auth/status").json()
              assert status["auth_required"] is True
              assert status["initialized"] is False

              created = client.post(
                  "/api/auth/bootstrap",
                  json={"username": "ciadmin", "password": "ci-password-123"},
              )
              assert created.status_code == 200, created.text
              token = created.json()["token"]
              headers = {"Authorization": f"Bearer {token}"}

              me = client.get("/api/auth/me", headers=headers)
              assert me.status_code == 200, me.text
              assert me.json()["role"] == "admin"

              datasets = client.get("/api/datasets", headers=headers)
              assert datasets.status_code == 200, datasets.text
              assert datasets.json()["total"] >= 1

              cache = client.get("/api/cache", headers=headers)
              assert cache.status_code == 200, cache.text

              assert client.get("/api/cache").status_code == 401
          print("api functional smoke ok")
          PY

  docker:
    name: Docker build and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neurokiln:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and check health
        run: |
          docker run -d --name neurokiln-ci -p 8100:8100 neurokiln:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8100/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          docker logs neurokiln-ci
          exit 1

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Critical-path E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            server/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"
          python -m pip install -r server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run critical-path E2E
        working-directory: web
        run: npm run test:e2e

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build
