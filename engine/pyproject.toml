[project]
name = "neurokiln-engine"
version = "0.4.0"
description = "NeuroKiln engine: data model, evaluation protocols and leakage-safe pipeline execution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyriemann>=0.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
datasets = ["mne>=1.6", "moabb>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
neurokiln = "neurokiln.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
